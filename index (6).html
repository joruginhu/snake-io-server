<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>SNAKE.IO — LCD EDITION</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#0d1105;overflow:hidden;overscroll-behavior:none;
    font-family:"Courier New",monospace;color:#7e9440;user-select:none;}

  #phone{background:#1b2410;padding:12px;border-radius:10px;
    box-shadow:inset 0 0 0 2px #33421c, inset 0 0 0 4px #161d0b, 0 14px 40px rgba(0,0,0,.75);}
  #screenWrap{position:relative;line-height:0;overflow:hidden;background:#a5c93a;}
  #screenWrap::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.075) 0 1px, rgba(0,0,0,0) 1px 3px);}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
  #hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;opacity:.35;}
  #nameIn{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;
    font-size:16px;user-select:text;-webkit-user-select:text;pointer-events:none;}
</style>
</head>
<body>
<div id="app">
  <div id="phone">
    <div id="screenWrap"><canvas id="screen"></canvas></div>
  </div>
</div>
<div id="hint">SNAKE.IO</div>
<input id="nameIn" type="text" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Nome"/>
<script>
(function(){
'use strict';

/* ============================================================
   PALETA LCD (4 tons monocromáticos estilo Nokia/Game Boy)
   ============================================================ */
const PAL = {
  BG:    '#a5c93a',
  BG2:   '#96b830',
  MID:   '#5f7a14',
  DARK:  '#1f2b06',
  LIGHT: '#dff0a0',
  OUT1:  '#3a4a0f',
  OUT2:  '#2c3a0b',
  TXT2:  '#34440d'     // texto secundário (escuro, bem legível)
};

/* ============================================================
   FONTE BITMAP 5x7
   ============================================================ */
const FONT_RAW = {
 A:'01110,10001,10001,11111,10001,10001,10001',
 B:'11110,10001,10001,11110,10001,10001,11110',
 C:'01110,10001,10000,10000,10000,10001,01110',
 D:'11110,10001,10001,10001,10001,10001,11110',
 E:'11111,10000,10000,11110,10000,10000,11111',
 F:'11111,10000,10000,11110,10000,10000,10000',
 G:'01110,10001,10000,10111,10001,10001,01111',
 H:'10001,10001,10001,11111,10001,10001,10001',
 I:'11111,00100,00100,00100,00100,00100,11111',
 J:'00111,00010,00010,00010,00010,10010,01100',
 K:'10001,10010,10100,11000,10100,10010,10001',
 L:'10000,10000,10000,10000,10000,10000,11111',
 M:'10001,11011,10101,10101,10001,10001,10001',
 N:'10001,11001,10101,10011,10001,10001,10001',
 O:'01110,10001,10001,10001,10001,10001,01110',
 P:'11110,10001,10001,11110,10000,10000,10000',
 Q:'01110,10001,10001,10001,10101,10010,01101',
 R:'11110,10001,10001,11110,10100,10010,10001',
 S:'01111,10000,10000,01110,00001,00001,11110',
 T:'11111,00100,00100,00100,00100,00100,00100',
 U:'10001,10001,10001,10001,10001,10001,01110',
 V:'10001,10001,10001,10001,10001,01010,00100',
 W:'10001,10001,10001,10101,10101,11011,10001',
 X:'10001,10001,01010,00100,01010,10001,10001',
 Y:'10001,10001,01010,00100,00100,00100,00100',
 Z:'11111,00001,00010,00100,01000,10000,11111',
 '0':'01110,10001,10011,10101,11001,10001,01110',
 '1':'00100,01100,00100,00100,00100,00100,01110',
 '2':'01110,10001,00001,00110,01000,10000,11111',
 '3':'11111,00010,00100,00010,00001,10001,01110',
 '4':'00010,00110,01010,10010,11111,00010,00010',
 '5':'11111,10000,11110,00001,00001,10001,01110',
 '6':'00110,01000,10000,11110,10001,10001,01110',
 '7':'11111,00001,00010,00100,01000,01000,01000',
 '8':'01110,10001,10001,01110,10001,10001,01110',
 '9':'01110,10001,10001,01111,00001,00010,01100',
 ':':'00000,00100,00100,00000,00100,00100,00000',
 '.':'00000,00000,00000,00000,00000,01100,01100',
 ',':'00000,00000,00000,00000,01100,00100,01000',
 '!':'00100,00100,00100,00100,00100,00000,00100',
 '?':'01110,10001,00001,00110,00100,00000,00100',
 '-':'00000,00000,00000,11111,00000,00000,00000',
 '+':'00000,00100,00100,11111,00100,00100,00000',
 '/':'00001,00010,00010,00100,01000,01000,10000',
 '%':'11001,11011,00010,00100,01000,11011,10011',
 '(':'00010,00100,01000,01000,01000,00100,00010',
 ')':'01000,00100,00010,00010,00010,00100,01000',
 '=':'00000,00000,11111,00000,11111,00000,00000',
 '<':'00010,00100,01000,10000,01000,00100,00010',
 '>':'01000,00100,00010,00001,00010,00100,01000',
 '*':'00000,10101,01110,11111,01110,10101,00000'
};

const FONT_ROWS = {};
for(const k in FONT_RAW){ FONT_ROWS[k] = FONT_RAW[k].split(','); }

/* ============================================================
   CANVAS / RESIZE
   ============================================================ */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', {alpha:false});
const nameEl = document.getElementById('nameIn');
const BEZEL = 24;
let W = 240, H = 180, SCALE = 3;
let playerName = '';

function getName(){ return playerName.trim() || 'VOCE'; }

function resize(){
  // não redimensiona enquanto o teclado está aberto no menu
  if(document.activeElement === nameEl && isFormMode()) return;
  const aw = Math.max(200, window.innerWidth - BEZEL);
  const ah = Math.max(160, window.innerHeight - BEZEL);
  let s = Math.round(Math.min(aw / 300, ah / 230));
  s = Math.max(2, Math.min(6, s || 2));
  SCALE = s;
  W = Math.max(120, Math.floor(aw / s));
  H = Math.max(100, Math.floor(ah / s));
  cv.width = W; cv.height = H;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

/* ============================================================
   SPRITES (círculos pixelados)
   ============================================================ */
const spriteCache = new Map();
function discSprite(color, r){
  const key = color + '|' + r;
  let c = spriteCache.get(key);
  if(c) return c;
  const size = r * 2 + 1;
  c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = color;
  for(let dy = -r; dy <= r; dy++){
    const hh = r * r - dy * dy;
    if(hh < 0) continue;
    const half = Math.floor(Math.sqrt(hh) + 0.0001);
    g.fillRect(r - half, r + dy, half * 2 + 1, 1);
  }
  spriteCache.set(key, c);
  return c;
}

/* dithering de fundo (fora da arena) */
let outPattern = null;
(function buildPattern(){
  const p = document.createElement('canvas');
  p.width = 2; p.height = 2;
  const g = p.getContext('2d');
  g.fillStyle = PAL.OUT2; g.fillRect(0,0,2,2);
  g.fillStyle = PAL.OUT1; g.fillRect(0,0,1,1); g.fillRect(1,1,1,1);
  outPattern = ctx.createPattern(p, 'repeat');
})();

/* ============================================================
   TEXTO
   ============================================================ */
function drawText(str, x, y, color, s){
  s = s || 1;
  str = String(str).toUpperCase();
  ctx.fillStyle = color;
  let cx = Math.round(x);
  for(let i = 0; i < str.length; i++){
    const ch = str[i];
    if(ch === ' '){ cx += 5 * s; continue; }
    const rows = FONT_ROWS[ch];
    if(!rows){ cx += 6 * s; continue; }
    for(let r = 0; r < 7; r++){
      const row = rows[r];
      let run = 0;
      for(let c = 0; c <= 5; c++){
        if(c < 5 && row[c] === '1'){ run++; continue; }
        if(run){ ctx.fillRect(cx + (c - run) * s, y + r * s, run * s, s); run = 0; }
      }
    }
    cx += 6 * s;
  }
}
function textWidth(str, s){
  s = s || 1;
  str = String(str).toUpperCase();
  let w = 0;
  for(let i = 0; i < str.length; i++) w += (str[i] === ' ' ? 5 : 6) * s;
  return w;
}
function drawTextC(str, cx, y, color, s){
  drawText(str, Math.round(cx - textWidth(str, s) / 2), y, color, s);
}
function pad4(n){
  n = Math.max(0, Math.round(n));
  let s = String(n);
  while(s.length < 4) s = '0' + s;
  return s;
}

/* ============================================================
   ÁUDIO (bips de LCD)
   ============================================================ */
let AC = null, muted = false, lastBeep = 0;
function initAudio(){
  if(!AC){
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur, vol, type){
  if(!AC || muted) return;
  const now = AC.currentTime;
  if(now - lastBeep < 0.02) return;
  lastBeep = now;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(vol || 0.025, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(now); o.stop(now + dur + 0.02);
}
function sfxEat(){ beep(680 + Math.random() * 140, 0.04, 0.02); }
function sfxBig(){ beep(320, 0.07, 0.03); setTimeout(function(){ beep(520, 0.07, 0.025); }, 60); }
function sfxKill(){ beep(180, 0.10, 0.04, 'square'); setTimeout(function(){ beep(120, 0.16, 0.035, 'sawtooth'); }, 90); }
function sfxDeath(){
  beep(400, 0.12, 0.04);
  setTimeout(function(){ beep(300, 0.14, 0.04); }, 110);
  setTimeout(function(){ beep(200, 0.28, 0.04); }, 230);
}
function sfxStart(){ beep(520, 0.06, 0.03); setTimeout(function(){ beep(780, 0.09, 0.03); }, 70); }

/* ============================================================
   CONFIG
   ============================================================ */
const CFG = {
  R: 900,             // raio da arena
  SEG: 2.0,           // espaçamento entre nós do corpo
  SPEED: 46,
  BOOST_MULT: 1.9,
  TURN: 3.7,
  TURN_BOOST: 2.5,
  FOOD_MAX: 1000,
  START_MASS: 12,
  NPM: 1.5,
  MAX_NODES: 420,
  AI: 30,
  R_HEAD: 3,
  R_BODY: 3,
  BOOST_COST: 15
};

const AI_NAMES = ['VIPER','KOBRA','MAMBA','PITON','TAIPAN','NAJA','SUCURI','JARARA','CASCAVEL','BOA','ANACONDA','CASCABEL','CORAL','DRAGAO','FURIA','ZUMBI',
                  'JIBOIA','URUTU','BOIUNA','SERPE','VENENO','SOMBRA','RAIO','TROVAO','LOBO','TIGRE','ONCA','FALCAO','NINJA','REI','HYDRA','COBRAO','VESPA','ESCAMA','FOGO','GELO','NEON','TURBO','BRUTO','GIGANTE','MINI','FLASH','ZERO'];
const AI_SHADES = ['#42561a','#4d5a12','#3b5220','#556019','#48602a'];
const PLAYER_COLOR = '#1f2b06';

/* ============================================================
   ESTADO
   ============================================================ */
let snakes = [], food = [], parts = [], floats = [], respawnQ = [];
let player = null;
let mode = 'menu';        // menu | play | dead
let deadT = 0, flash = 0, killMsg = 0, killMsgText = '';
let best = 0, tclock = 0, lastFrame = 0;
const cam = {x:0, y:0};
let nextAiName = 0;
let difficulty = 1;      // 0 fácil | 1 médio | 2 difícil
let online = false;      // true = jogando em uma sala multiplayer
let lobbyPage = 0, joinTarget = null, formErr = '';
const createOpts = { priv: false, max: 8 };
// Endereço do servidor multiplayer (depois de publicar no Render). Ex.: 'wss://snake-io-abcd.onrender.com'
const SERVER_URL = 'wss://snake-io-server.onrender.com';
const BASE_R = 900;
const ONLINE_SHADES = ['#42561a','#4d5a12','#3b5220','#556019','#48602a','#2f4a2a','#5b6b1c','#3d4d17'];

/* ============================================================
   SNAKE
   ============================================================ */
function nodesFor(mass){
  return Math.max(10, Math.min(CFG.MAX_NODES, Math.round(mass * CFG.NPM)));
}

/* largura da cobra cresce com a massa (como no slither.io) */
function radiusFor(mass){
  return Math.min(9, 3 + Math.floor(Math.sqrt(Math.max(0, mass - 12)) / 2.4));
}

function makeSnake(o){
  const s = {
    isPlayer: !!o.isPlayer,
    name: o.name || 'COBRA',
    color: o.color,
    x: o.x, y: o.y,
    angle: o.angle,
    targetAngle: o.angle,
    mass: o.mass,
    r: radiusFor(o.mass),
    path: [],
    boosting: false,
    dead: false,
    think: 0,
    tx: o.x, ty: o.y,
    chasing: false,
    bbox: {x0:0, y0:0, x1:0, y1:0},
    dropT: 0,
    turnMul: 1,
    state: 'wander', prey: null, threat: null,
    err: 0, phase: Math.random() * 6.28,
    stratT: Math.random() * 0.8, steerT: Math.random() * 0.1,
    desAngle: o.angle, blind: 0, boostT: 0, boostCool: 0,
    skipUntil: 0, skipX: 0, skipY: 0, nearTarget: null, nearSince: 0,
    protect: 0
  };
  const n = nodesFor(o.mass);
  for(let i = 0; i < n; i++){
    s.path.push({ x: o.x - Math.cos(o.angle) * i * CFG.SEG,
                  y: o.y - Math.sin(o.angle) * i * CFG.SEG });
  }
  let bx0 = s.x, by0 = s.y, bx1 = s.x, by1 = s.y;
  for(let i = 0; i < s.path.length; i++){
    const q = s.path[i];
    if(q.x < bx0) bx0 = q.x; if(q.x > bx1) bx1 = q.x;
    if(q.y < by0) by0 = q.y; if(q.y > by1) by1 = q.y;
  }
  s.bbox.x0 = bx0; s.bbox.y0 = by0; s.bbox.x1 = bx1; s.bbox.y1 = by1;
  return s;
}

function randPoint(maxD){
  const a = Math.random() * Math.PI * 2;
  const d = Math.sqrt(Math.random()) * maxD;
  return { x: Math.cos(a) * d, y: Math.sin(a) * d };
}

/* regiões onde cobras novas NÃO podem nascer (em volta do jogador) */
function avoidList(){
  if(player && !player.dead && mode === 'play') return [{ x: player.x, y: player.y, r: 340 }];
  return null;
}

function spawnAI(initial){
  let mass = randAiMass(initial), sp;
  for(let k = 0; k < 4; k++){
    sp = findSpawn(WORLD, mass, { maxD: CFG.R * (mass > 150 ? 0.6 : 0.82), clear: 12, ahead: 50, outward: true, avoid: avoidList() });
    if(sp.gap >= 0 || mass < 14) break;
    mass = Math.max(10, mass * 0.7);       // sem espaço livre: nasce menor
  }
  const name = AI_NAMES[(nextAiName++) % AI_NAMES.length];
  const s = makeSnake({
    name: name,
    color: AI_SHADES[Math.floor(Math.random() * AI_SHADES.length)],
    x: sp.x, y: sp.y,
    angle: sp.angle,
    mass: mass,
    isPlayer: false
  });
  s.turnMul = DIFF[difficulty].turn;
  snakes.push(s);
  return s;
}

function spawnPlayer(){
  // o jogador nasce longe da cabeça de qualquer outra cobra
  const av = [];
  for(let i = 0; i < snakes.length; i++) if(!snakes[i].dead) av.push({ x: snakes[i].x, y: snakes[i].y, r: 160 });
  const sp = findSpawn(WORLD, CFG.START_MASS, { maxD: CFG.R * 0.6, clear: 60, ahead: 170, outward: false, avoid: av });
  player = makeSnake({
    name: getName(),
    color: PLAYER_COLOR,
    x: sp.x, y: sp.y,
    angle: sp.angle,
    mass: CFG.START_MASS,
    isPlayer: true
  });
  player.protect = 3;            // 3 s de proteção ao nascer
  snakes.push(player);
  pointer.active = false;
}

function spawnFood(n){
  for(let i = 0; i < n; i++){
    const p = randPoint(CFG.R * 0.96);
    food.push({ x: p.x, y: p.y, m: 0.7, big: false });
  }
}

function resetWorld(withPlayer){
  snakes = []; food = []; parts = []; floats = []; respawnQ = [];
  nextAiName = (Math.random() * 7) | 0;
  for(let i = 0; i < CFG.AI; i++) spawnAI(true);
  spawnFood(CFG.FOOD_MAX);
  if(withPlayer) spawnPlayer(); else player = null;
}

/* ============================================================
   INPUT
   ============================================================ */
const pointer = { x: 0, y: 0, down: false, active: false };
const keys = {};
let touchMode = false, turboHeld = false;
let steerId = null, boostId = null;

function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE };
}
function turboBtn(){
  const size = 34;
  return { x: W - size - 5, y: H - size - 5, s: size };
}
/* joystick virtual (celular): fica entre o mapa e o botão TURBO */
const joy = { active: false, id: null, ang: 0, len: 0, kx: 0, ky: 0 };
function joyLayout(){
  const mm = Math.min(46, Math.max(30, Math.round(H * 0.26)));   // largura do minimapa
  const left = 3 + mm + 6;
  const right = turboBtn().x - 6;
  let r = Math.floor(Math.min((right - left) / 2, 30, H * 0.24));
  r = Math.max(14, r);
  return { cx: Math.round((left + right) / 2), cy: H - r - 4, r: r, kr: Math.max(5, Math.round(r * 0.38)), hit: r + 14 };
}
function joyMove(p){
  const J = joyLayout();
  const dx = p.x - J.cx, dy = p.y - J.cy;
  const len = Math.hypot(dx, dy);
  joy.len = Math.min(len, J.r);
  if(len > 3) joy.ang = Math.atan2(dy, dx);
  const m = Math.min(len, J.r - J.kr);
  joy.kx = len > 0 ? dx / len * m : 0;
  joy.ky = len > 0 ? dy / len * m : 0;
}
function joyReset(){ joy.active = false; joy.id = null; joy.len = 0; joy.kx = 0; joy.ky = 0; }

function inTurbo(x, y){
  const b = turboBtn();
  return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6;
}

/* ---------- campos de texto (input oculto + desenho no canvas) ---------- */
const FIELDS = {
  name:  { max: 10, re: /[^A-Z0-9 .\-]/g },
  room:  { max: 12, re: /[^A-Z0-9 .\-]/g },
  pass:  { max: 12, re: /[^A-Z0-9]/g },
  jpass: { max: 12, re: /[^A-Z0-9]/g }
};
const fval = { room: '', pass: '', jpass: '' };
let activeField = null;

function fieldVal(k){ return k === 'name' ? playerName : fval[k]; }
function setFieldVal(k, v){ if(k === 'name') playerName = v; else fval[k] = v; }

nameEl.addEventListener('input', function(){
  const k = activeField || 'name';
  const sp = FIELDS[k];
  let v = nameEl.value.toUpperCase().replace(sp.re, '').replace(/^\s+/, '').slice(0, sp.max);
  if(v !== nameEl.value) nameEl.value = v;
  setFieldVal(k, v);
});
nameEl.addEventListener('blur', function(){ activeField = null; resize(); });

function focusField(k){
  activeField = k;
  nameEl.maxLength = FIELDS[k].max;
  nameEl.value = fieldVal(k);
  try{ nameEl.focus({preventScroll:true}); }catch(e){ nameEl.focus(); }
}
function fieldFocused(k){ return activeField === k && document.activeElement === nameEl; }
function isFormMode(){ return mode === 'menu' || mode === 'lobby' || mode === 'create' || mode === 'joinpass'; }

function closeGame(){
  try{ window.close(); }catch(e){}
  // se o navegador não permitir fechar a aba, sai para uma página em branco
  setTimeout(function(){
    try{ window.location.replace('about:blank'); }catch(e){}
  }, 150);
}

function hitRect(p, x, y, w, h){
  return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
}

cv.addEventListener('pointerdown', function(e){
  initAudio();
  if(e.pointerType === 'touch') touchMode = true;
  if(mode !== 'play') return;   // menus e telas usam o evento 'click'
  const p = canvasPos(e);
  if(e.pointerType === 'touch'){
    // celular: só o joystick guia e só o botão TURBO acelera (tocar no mapa não faz nada)
    if(inTurbo(p.x, p.y)){
      turboHeld = true; boostId = e.pointerId;
    } else {
      const J = joyLayout();
      if(joy.id === null && Math.hypot(p.x - J.cx, p.y - J.cy) <= J.hit){
        joy.id = e.pointerId; joy.active = true; joyMove(p);
      }
    }
    e.preventDefault();
    return;
  }
  steerId = e.pointerId;
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  pointer.down = true;
  e.preventDefault();
}, {passive:false});

cv.addEventListener('click', function(e){
  initAudio();
  const p = canvasPos(e);
  if(mode === 'dead'){
    if(deadT < 0.8) return;
    const D = deadLayout();
    if(hitRect(p, D.bx, D.retryY, D.bw, D.bh)) retryGame();
    else if(hitRect(p, D.bx, D.menuY, D.bw, D.bh)) goMenu();
  } else if(mode === 'menu') menuClick(p);
  else if(mode === 'lobby') lobbyClick(p);
  else if(mode === 'create') createClick(p);
  else if(mode === 'joinpass') joinClick(p);
});

cv.addEventListener('wheel', function(e){
  if(mode === 'lobby'){
    lobbyPage += (e.deltaY > 0 ? 1 : -1);
    clampLobbyPage();
    e.preventDefault();
  }
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  if(e.pointerId === joy.id){ joyMove(canvasPos(e)); return; }
  if(e.pointerType === 'touch') return;
  if(steerId !== null && e.pointerId !== steerId) return;
  const p = canvasPos(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
});

function releasePointer(e){
  if(e.pointerId === boostId){ turboHeld = false; boostId = null; }
  if(e.pointerId === steerId) steerId = null;
  if(e.pointerId === joy.id) joyReset();
  if(e.pointerType !== 'touch') pointer.down = false;
}
cv.addEventListener('pointerup', releasePointer);
cv.addEventListener('pointercancel', releasePointer);
window.addEventListener('blur', function(){ pointer.down = false; turboHeld = false; joyReset(); });

window.addEventListener('keydown', function(e){

  } else if(mode === 'play'){

  } else if(k === 'enter') formEnter();

});

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

/* ============================================================
   MOVIMENTO
   ============================================================ */
function angleDiff(a, b){
  let d = a - b;
  while(d > Math.PI) d -= Math.PI * 2;
  while(d < -Math.PI) d += Math.PI * 2;
  return d;
}

function moveSnake(s, dt){
  // turbo
  if(s.boosting){
    if(s.mass <= 14){ s.boosting = false; }
    else {
      s.mass -= CFG.BOOST_COST * dt;
      s.dropT += dt;
      if(s.dropT > 0.14){
        s.dropT = 0;
        const n = s.path[Math.min(s.path.length - 1, 5)];
        if(n) food.push({ x: n.x + (Math.random() - 0.5) * 3, y: n.y + (Math.random() - 0.5) * 3, m: 0.55, big: false });
      }
    }
  }
  const turn = (s.boosting ? CFG.TURN_BOOST : CFG.TURN) * (s.turnMul || 1) * dt;
  const d = angleDiff(s.targetAngle, s.angle);
  s.angle += Math.max(-turn, Math.min(turn, d));

  const spd = CFG.SPEED * (s.boosting ? CFG.BOOST_MULT : 1);
  s.x += Math.cos(s.angle) * spd * dt;
  s.y += Math.sin(s.angle) * spd * dt;

  const h = s.path[0];
  if(!h || Math.hypot(s.x - h.x, s.y - h.y) >= CFG.SEG){
    s.path.unshift({ x: s.x, y: s.y });
  }
  const maxN = nodesFor(s.mass);
  while(s.path.length > maxN) s.path.pop();
  s.r = radiusFor(s.mass);

  // bbox
  let x0 = s.x, y0 = s.y, x1 = s.x, y1 = s.y;
  const st = s.path.length > 60 ? 2 : 1;
  for(let i = 0; i < s.path.length; i += st){
    const n = s.path[i];
    if(n.x < x0) x0 = n.x; if(n.x > x1) x1 = n.x;
    if(n.y < y0) y0 = n.y; if(n.y > y1) y1 = n.y;
  }
  s.bbox.x0 = x0; s.bbox.y0 = y0; s.bbox.x1 = x1; s.bbox.y1 = y1;
}

/* direção desejada: teclado, joystick (celular) ou mouse. null = sem mudança */
function readSteer(p){
  if(keys['arrowleft'] || keys['a']) return p.angle - 1.0;
  if(keys['arrowright'] || keys['d']) return p.angle + 1.0;
  if(joy.active && joy.len > 3) return joy.ang;
  if(pointer.active){
    const tx = pointer.x + cam.x - W / 2;
    const ty = pointer.y + cam.y - H / 2;
    const dx = tx - p.x, dy = ty - p.y;
    if(dx * dx + dy * dy > 9) return Math.atan2(dy, dx);
  }
  return null;
}

function steerPlayer(dt){
  const p = player;
  const a = readSteer(p);
  if(a !== null) p.targetAngle = a;
  const wantBoost = pointer.down || turboHeld || keys[' '];
  p.boosting = wantBoost && p.mass > 14;
}

/* ============================================================
   IA
   ============================================================ */
/* AI-CORE-BEGIN  (mesmo código no jogo e no servidor — não editar só de um lado) */
const AI_SEG = 2;
const FOOD_CELL = 60;

/* parâmetros de cada dificuldade */
const DIFF = [
  { // FÁCIL: reage devagar, erra a mira, quase não ataca
    reactMin:0.22, reactMax:0.40, stratMin:1.2,  stratMax:2.6,
    noise:0.30, err:0.35, look:0.8,  aggr:0.12, hunt:0.70, boost:0.0, flee:0.35, turn:0.82, mistake:0.025 },
  { // MÉDIO
    reactMin:0.10, reactMax:0.18, stratMin:0.7,  stratMax:1.5,
    noise:0.14, err:0.14, look:1.0,  aggr:0.40, hunt:0.85, boost:0.5, flee:0.75, turn:0.95, mistake:0.006 },
  { // DIFÍCIL: reflexo rápido, corta a frente, foge de cobra maior
    reactMin:0.04, reactMax:0.08, stratMin:0.35, stratMax:0.8,
    noise:0.05, err:0.04, look:1.3,  aggr:0.80, hunt:1.00, boost:1.0, flee:1.0,  turn:1.0,  mistake:0 }
];

/* tamanhos variados: pequenas, médias, grandes e gigantes */
function randAiMass(initial){
  const r = Math.random();
  if(initial){
    if(r < 0.45) return 10 + Math.random() * 25;
    if(r < 0.78) return 35 + Math.random() * 65;
    if(r < 0.94) return 100 + Math.random() * 120;
    return 220 + Math.random() * 180;
  }
  if(r < 0.6) return 10 + Math.random() * 20;
  if(r < 0.9) return 30 + Math.random() * 50;
  return 80 + Math.random() * 100;
}

/* campos de IA que toda cobra controlada pela IA precisa ter */
function aiFields(angle){
  return {
    turnMul: 1, state: 'wander', prey: null, threat: null,
    err: 0, phase: Math.random() * 6.28,
    stratT: Math.random() * 0.8, steerT: Math.random() * 0.1,
    desAngle: angle, blind: 0, boostT: 0, boostCool: 0,
    skipUntil: 0, skipX: 0, skipY: 0, nearTarget: null, nearSince: 0
  };
}

/* ---------- onde nascer sem cruzar ninguém ---------- */
/* testa o corpo inteiro (para trás) e o caminho à frente contra todas as cobras vivas */
function findSpawn(w, mass, opt){
  const n = nodesFor(mass), rn = radiusFor(mass);
  const list = [];
  for(let i = 0; i < w.snakes.length; i++) if(!w.snakes[i].dead) list.push(w.snakes[i]);
  const nb = Math.ceil(n / 3);
  const total = nb + Math.ceil(opt.ahead / 10);
  const lim = (w.R - 45) * (w.R - 45);
  let best = null, bestGap = -1e9;
  for(let t = 0; t < 90; t++){
    const a0 = Math.random() * Math.PI * 2, dd = Math.sqrt(Math.random()) * opt.maxD;
    const x = Math.cos(a0) * dd, y = Math.sin(a0) * dd;
    const angle = opt.outward ? Math.atan2(y, x) + (Math.random() - 0.5) * 1.2 : Math.random() * Math.PI * 2;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    let minGap = 1e9, wall = false;
    for(let i = 0; i < total && !wall; i++){
      const dist = i < nb ? -i * 3 * AI_SEG : (i - nb + 1) * 10;
      const px = x + ca * dist, py = y + sa * dist;
      if(px * px + py * py > lim){ wall = true; break; }
      if(opt.avoid){                                   // nunca nasce perto de quem já está jogando
        for(let v = 0; v < opt.avoid.length; v++){
          const av = opt.avoid[v], ax = px - av.x, ay = py - av.y;
          if(ax * ax + ay * ay < av.r * av.r){ wall = true; break; }
        }
        if(wall) break;
      }
      for(let k = 0; k < list.length; k++){
        const o = list[k], b = o.bbox;
        const m = rn + o.r + opt.clear + 6;
        if(px < b.x0 - m || px > b.x1 + m || py < b.y0 - m || py > b.y1 + m) continue;
        let md2 = (o.x - px) * (o.x - px) + (o.y - py) * (o.y - py);
        for(let q = 0; q < o.path.length; q += 2){
          const dx = o.path[q].x - px, dy = o.path[q].y - py;
          const d2 = dx * dx + dy * dy;
          if(d2 < md2) md2 = d2;
        }
        const gap = Math.sqrt(md2) - rn - o.r;
        if(gap < minGap) minGap = gap;
      }
    }
    if(wall) continue;
    if(minGap >= opt.clear) return { x: x, y: y, angle: angle, gap: minGap };
    if(minGap > bestGap){ bestGap = minGap; best = { x: x, y: y, angle: angle, gap: minGap }; }
  }
  if(!best && opt.avoid){                              // sem lugar longe do jogador: tenta sem essa regra
    const o2 = {};
    for(const key in opt) o2[key] = opt[key];
    o2.avoid = null;
    return findSpawn(w, mass, o2);
  }
  return best || { x: 0, y: 0, angle: Math.random() * Math.PI * 2, gap: -1 };
}

/* ---------- mapa de comida (grade) para as IAs "enxergarem" onde tem bolinha ---------- */
function foodKey(cx, cy){ return (cx + 64) * 128 + (cy + 64); }

function rebuildFoodGrid(w, list){
  const g = w.grid;
  g.clear();
  for(const f of list){
    if(f.gone) continue;
    const cx = Math.floor(f.x / FOOD_CELL), cy = Math.floor(f.y / FOOD_CELL);
    const k = foodKey(cx, cy);
    let c = g.get(k);
    if(!c){ c = { list: [], sum: 0, sx: 0, sy: 0 }; g.set(k, c); }
    c.list.push(f);
    c.sum += f.m * (f.big ? 1.6 : 1);
    c.sx += f.x; c.sy += f.y;
  }
}

function foodRichness(w, x, y, rad){
  const x0 = Math.floor((x - rad) / FOOD_CELL), x1 = Math.floor((x + rad) / FOOD_CELL);
  const y0 = Math.floor((y - rad) / FOOD_CELL), y1 = Math.floor((y + rad) / FOOD_CELL);
  let sum = 0;
  for(let cx = x0; cx <= x1; cx++){
    for(let cy = y0; cy <= y1; cy++){
      const c = w.grid.get(foodKey(cx, cy));
      if(c) sum += c.sum;
    }
  }
  return sum;
}

/* bolinha mais "gostosa" por perto (perto, grande e à frente) */
function bestFoodAround(w, s, rad){
  const rad2 = rad * rad;
  const x0 = Math.floor((s.x - rad) / FOOD_CELL), x1 = Math.floor((s.x + rad) / FOOD_CELL);
  const y0 = Math.floor((s.y - rad) / FOOD_CELL), y1 = Math.floor((s.y + rad) / FOOD_CELL);
  const skip = w.time < s.skipUntil;
  let best = null, bs = 0;
  for(let cx = x0; cx <= x1; cx++){
    for(let cy = y0; cy <= y1; cy++){
      const c = w.grid.get(foodKey(cx, cy));
      if(!c) continue;
      for(let i = 0; i < c.list.length; i++){
        const f = c.list[i];
        if(f.gone) continue;
        const dx = f.x - s.x, dy = f.y - s.y, d2 = dx * dx + dy * dy;
        if(d2 > rad2) continue;
        if(skip && Math.abs(f.x - s.skipX) < 14 && Math.abs(f.y - s.skipY) < 14) continue;
        const dist = Math.sqrt(d2);
        const ang = Math.abs(angleDiff(Math.atan2(dy, dx), s.angle));
        if(dist < 22 && ang > 1.3) continue;           // colada e atrás: pega na volta
        const sc = f.m * (f.big ? 1.8 : 1) / (dist + 10) * (1.35 - ang * 0.3);
        if(sc > bs){ bs = sc; best = f; }
      }
    }
  }
  return best;
}

/* melhor "monte" de comida mais longe (restos de cobra morta, aglomerados) */
function bestCluster(w, s, d, scary){
  const rad = (320 + s.r * 10) * d.look;
  const cr = Math.ceil(rad / FOOD_CELL);
  const ccx = Math.floor(s.x / FOOD_CELL), ccy = Math.floor(s.y / FOOD_CELL);
  let best = null, bs = 0;
  for(let cx = ccx - cr; cx <= ccx + cr; cx++){
    for(let cy = ccy - cr; cy <= ccy + cr; cy++){
      const c = w.grid.get(foodKey(cx, cy));
      if(!c || c.sum <= 0) continue;
      const n = c.list.length;
      const mx = c.sx / n, my = c.sy / n;
      const dx = mx - s.x, dy = my - s.y;
      const dist = Math.hypot(dx, dy);
      if(dist > rad) continue;
      const ang = Math.abs(angleDiff(Math.atan2(dy, dx), s.angle));
      const sc = c.sum / (dist + 45) * (1.3 - ang * 0.22);
      if(sc <= bs) continue;
      let bad = false;
      for(let j = 0; j < scary.length; j++){
        if(Math.hypot(mx - scary[j].x, my - scary[j].y) < 60 + scary[j].r * 3){ bad = true; break; }
      }
      if(bad) continue;
      bs = sc; best = { x: mx, y: my };
    }
  }
  return best;
}

/* ---------- percepção de perigo ---------- */
function obstaclePenalty(w, px, py, self){
  let minD = 1e9;
  const list = w.snakes;
  for(let k = 0; k < list.length; k++){
    const o = list[k];
    if(o === self || o.dead) continue;
    const b = o.bbox;
    const m = 36 + o.r;
    if(px < b.x0 - m || px > b.x1 + m || py < b.y0 - m || py > b.y1 + m) continue;
    let minD2 = 1e9;
    let hx = o.x - px, hy = o.y - py;
    let hd = hx * hx + hy * hy;
    if(hd < minD2) minD2 = hd;
    hx = o.x + Math.cos(o.angle) * 16 - px; hy = o.y + Math.sin(o.angle) * 16 - py;
    hd = hx * hx + hy * hy;
    if(hd < minD2) minD2 = hd;
    const step = o.path.length > 50 ? 2 : 1;
    for(let i = 0; i < o.path.length; i += step){
      const n = o.path[i];
      const dx = n.x - px, dy = n.y - py;
      const d2 = dx * dx + dy * dy;
      if(d2 < minD2) minD2 = d2;
    }
    const d = Math.sqrt(minD2) - (o.r - 3) - (self.r - 3);
    if(d < minD) minD = d;
  }
  if(minD > 18) return 0;
  return Math.min(1.5, (18 - minD) / 18);
}

function wander(w, s){
  const a = Math.random() * Math.PI * 2;
  const dist = 90 + Math.random() * 220;
  let tx = s.x + Math.cos(a) * dist;
  let ty = s.y + Math.sin(a) * dist;
  const dd = Math.hypot(tx, ty);
  const lim = w.R * 0.88;
  if(dd > lim){ tx *= lim / dd; ty *= lim / dd; }
  s.tx = tx; s.ty = ty;
}

/* decisão estratégica: fugir, caçar, comer ou passear */
function aiStrategy(w, s){
  const d = DIFF[w.diff];
  s.err = (Math.random() - 0.5) * 2 * d.err;
  s.prey = null; s.threat = null;
  const list = w.snakes;

  const scary = [];
  let threat = null, td = 1e9;
  const tr = (140 + s.r * 6) * d.look;
  for(let i = 0; i < list.length; i++){
    const o = list[i];
    if(o === s || o.dead || o.mass <= s.mass * 1.2) continue;
    const dd = Math.hypot(o.x - s.x, o.y - s.y);
    if(dd < 420) scary.push(o);
    if(dd < tr && dd < td){ td = dd; threat = o; }
  }
  if(threat && Math.random() < d.flee){
    s.state = 'flee'; s.threat = threat; return;
  }

  // com fome (muita comida por perto) a IA caça bem menos
  let aggr = d.aggr;
  if(foodRichness(w, s.x, s.y, 120) > 5) aggr *= 0.25;
  if(Math.random() < aggr){
    let bestS = 0, prey = null;
    const lim = (260 + s.r * 8) * d.look;
    for(let i = 0; i < list.length; i++){
      const o = list[i];
      if(o === s || o.dead || o.mass > s.mass * d.hunt) continue;
      const dd = Math.hypot(o.x - s.x, o.y - s.y);
      if(dd > lim) continue;
      let sc = (o.mass + 20) / (dd + 40);
      if(o.isPlayer && w.diff > 1) sc *= 1.5;      // só no difícil as IAs perseguem o jogador de propósito
      if(sc > bestS){ bestS = sc; prey = o; }
    }
    if(prey){ s.state = 'hunt'; s.prey = prey; return; }
  }

  const cl = bestCluster(w, s, d, scary);
  if(cl){ s.state = 'food'; s.tx = cl.x; s.ty = cl.y; return; }
  s.state = 'wander'; wander(w, s);
}

/* ângulo desejado conforme o estado (com ruído "humano") */
function aiGoalAngle(w, s, d){
  let tx = s.tx, ty = s.ty;
  const st = s.state;
  if(st === 'flee'){
    const th = s.threat;
    if(!th || th.dead){ s.state = 'wander'; s.stratT = 0; }
    else {
      const dist = Math.hypot(th.x - s.x, th.y - s.y);
      if(dist > 300){ s.state = 'wander'; s.stratT = 0; }
      else {
        let ax = s.x - th.x, ay = s.y - th.y;
        const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
        const cl = Math.hypot(s.x, s.y) || 1;
        const wgt = Math.max(0, cl / w.R - 0.4) * 1.4;     // perto da borda, mistura com o centro
        ax += (-s.x / cl) * wgt; ay += (-s.y / cl) * wgt;
        tx = s.x + ax * 100; ty = s.y + ay * 100;
        if(dist < 100 + th.r * 3 && s.mass > 24 && s.boostCool <= 0 && Math.random() < d.boost){
          s.boostT = 0.5 + Math.random() * 0.6; s.boostCool = 2.2;
        }
      }
    }
  } else if(st === 'hunt'){
    const pr = s.prey;
    if(!pr || pr.dead){ s.state = 'wander'; s.stratT = 0; }
    else {
      const dist = Math.hypot(pr.x - s.x, pr.y - s.y);
      if(dist > 480){ s.state = 'wander'; s.stratT = 0; }
      else {
        // mira à frente da cabeça da presa para cortar o caminho
        const lead = Math.max(24, Math.min(120, dist * 0.7));
        tx = pr.x + Math.cos(pr.angle) * lead;
        ty = pr.y + Math.sin(pr.angle) * lead;
        const aimErr = Math.abs(angleDiff(Math.atan2(ty - s.y, tx - s.x), s.angle));
        if(dist > 50 && dist < 190 && aimErr < 0.5 && s.mass > 30 && s.boostCool <= 0 && Math.random() < d.boost * 0.5){
          s.boostT = 0.5 + Math.random() * 0.7; s.boostCool = 3;
        }
      }
    }
  } else {
    // comendo / passeando: vai sempre atrás da bolinha mais próxima à frente (varre o monte inteiro)
    const nf = bestFoodAround(w, s, st === 'food' ? 95 : 70);
    if(nf){
      s.state = 'food'; s.tx = nf.x; s.ty = nf.y; tx = nf.x; ty = nf.y;
      const dd = Math.hypot(nf.x - s.x, nf.y - s.y);
      if(dd < 28){
        // colada mas sem conseguir pegar (órbita): ignora essa bolinha por um tempo
        if(s.nearTarget !== nf){ s.nearTarget = nf; s.nearSince = w.time; }
        else if(w.time - s.nearSince > 1.1){ s.skipX = nf.x; s.skipY = nf.y; s.skipUntil = w.time + 4; s.nearTarget = null; }
      } else s.nearTarget = null;
    } else if(st === 'food'){
      if(Math.hypot(tx - s.x, ty - s.y) < 14) s.stratT = 0;      // chegou: escolhe o próximo monte
    } else {
      if(Math.hypot(tx - s.x, ty - s.y) < 30) wander(w, s);
    }
  }
  const sway = (st === 'hunt' || st === 'flee') ? 0.35 : 1;
  return Math.atan2(ty - s.y, tx - s.x) + s.err + Math.sin(w.time * 1.7 + s.phase) * d.noise * sway;
}

/* escolhe a melhor direção livre perto do ângulo desejado (antenas à frente) */
function aiSteer(w, s, desired, d){
  const R = s.r;
  const look1 = (16 + R * 2) * d.look;
  const look2 = look1 * 2.1;
  const wl = w.R - 28 - R;
  const blind = s.blind > 0;
  let bestScore = -1e9, bestA = s.angle;
  for(let k = -7; k <= 7; k++){
    const off = k * 0.22;
    const a = s.angle + off;
    const c = Math.cos(a), sn = Math.sin(a);
    const x1 = s.x + c * look1, y1 = s.y + sn * look1;
    const x2 = s.x + c * look2, y2 = s.y + sn * look2;
    let score = -Math.abs(angleDiff(desired, a)) * 1.6 - Math.abs(off) * 0.12;
    const b1 = Math.hypot(x1, y1), b2 = Math.hypot(x2, y2);
    if(b1 > wl) score -= 6 + (b1 - wl) * 0.5;
    if(b2 > wl) score -= 2 + (b2 - wl) * 0.15;
    if(!blind){
      score -= obstaclePenalty(w, x1, y1, s) * 10;
      score -= obstaclePenalty(w, x2, y2, s) * 4;
    }
    if(score > bestScore){ bestScore = score; bestA = a; }
  }
  return bestA;
}

function aiThink(w, s, dt){
  const d = DIFF[w.diff];
  s.stratT -= dt; s.steerT -= dt;
  if(s.blind > 0) s.blind -= dt;
  if(s.boostCool > 0) s.boostCool -= dt;
  if(s.boostT > 0) s.boostT -= dt;

  if(s.stratT <= 0){
    s.stratT = d.stratMin + Math.random() * (d.stratMax - d.stratMin);
    aiStrategy(w, s);
  }
  if(s.steerT <= 0){
    s.steerT = d.reactMin + Math.random() * (d.reactMax - d.reactMin);
    if(d.mistake && Math.random() < d.mistake) s.blind = 0.5 + Math.random() * 0.6;
    s.desAngle = aiSteer(w, s, aiGoalAngle(w, s, d), d);
  }
  // suaviza a mudança de direção (movimento fluido)
  s.targetAngle += angleDiff(s.desAngle, s.targetAngle) * Math.min(1, dt * 9);
  s.wantBoost = s.boosting = s.boostT > 0 && s.mass > 20;
}
/* AI-CORE-END */

/* ============================================================
   COLISÕES / COMER / MORTE
   ============================================================ */
function killSnake(s, killer){
  if(s.dead) return;
  s.dead = true;
  const total = s.mass * 0.8;
  const cnt = Math.max(4, Math.min(110, Math.floor(s.path.length / 2)));
  const per = Math.max(0.5, Math.min(6, total / cnt));
  const step = Math.max(1, Math.floor(s.path.length / cnt));
  for(let i = 0; i < s.path.length; i += step){
    const n = s.path[i];
    food.push({ x: n.x + (Math.random() - 0.5) * 2, y: n.y + (Math.random() - 0.5) * 2,
                m: per, big: per > 1.6 });
  }
  for(let i = 0; i < 8; i++){
    parts.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, t: 0.5 });
  }
  if(killer && killer.isPlayer){
    killMsg = 1.6;
    killMsgText = 'ELIMINADO ' + s.name;
    floats.push({ x: s.x, y: s.y, text: '+' + Math.round(s.mass), t: 1.2 });
    sfxKill();
  }
  if(s.isPlayer){
    mode = 'dead';
    deadT = 0;
    flash = 0.35;
    best = Math.max(best, Math.round(s.mass));
    sfxDeath();
  } else {
    respawnQ.push(1.6 + Math.random() * 2.2);
  }
  if(food.length > 2600) food.splice(0, food.length - 2600);
}

function handleCollisions(){
  for(let a = 0; a < snakes.length; a++){
    const s = snakes[a];
    if(s.dead || s.protect > 0) continue;
    // borda
    if(s.x * s.x + s.y * s.y > (CFG.R - 1) * (CFG.R - 1)){ killSnake(s, null); continue; }

    for(let b = 0; b < snakes.length; b++){
      const o = snakes[b];
      if(o === s || o.dead) continue;
      const bb = o.bbox;
      const mg = s.r + o.r + 2;
      if(s.x < bb.x0 - mg || s.x > bb.x1 + mg || s.y < bb.y0 - mg || s.y > bb.y1 + mg) continue;

      const hth = s.r + o.r - 2;
      const hdx = o.x - s.x, hdy = o.y - s.y;
      if(hdx * hdx + hdy * hdy < hth * hth){ killSnake(s, o); break; }
      let hit = false;
      const n = o.path.length, st = n > 60 ? 2 : 1;
      for(let i = 0; i < n; i += st){
        const q = o.path[i], t = n - 1 - i;
        // mesmo raio que é desenhado (a ponta do rabo é mais fina)
        const rr = t < 8 ? Math.max(2, Math.round(o.r * (0.55 + 0.45 * t / 8))) : o.r;
        const tt = s.r + rr - 2;
        const dx = q.x - s.x, dy = q.y - s.y;
        if(dx * dx + dy * dy < tt * tt){ hit = true; break; }
      }
      if(hit){ killSnake(s, o); break; }
    }
  }
}

function updateFood(dt){
  const pulse = Math.floor(tclock * 3) % 2;

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    const rr = s.r + 3.2;
    const rr2 = rr * rr;
    for(let j = food.length - 1; j >= 0; j--){
      const f = food[j];
      const dx = f.x - s.x, dy = f.y - s.y;
      if(dx * dx + dy * dy < rr2){
        s.mass += f.m;
        f.gone = true;
        food.splice(j, 1);
        if(s.isPlayer){
          beep(f.big ? 420 : (620 + Math.random() * 180), 0.035, 0.018);
          if(f.big) sfxBig();
          for(let k = 0; k < (f.big ? 5 : 2); k++){
            parts.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, t: 0.35 });
          }
        }
      }
    }
  }
  // mantém comida no mapa
  if(food.length < CFG.FOOD_MAX){
    spawnFood(Math.min(5, CFG.FOOD_MAX - food.length));
  }
  // partículas
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.t -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if(p.t <= 0) parts.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    floats[i].t -= dt;
    floats[i].y -= dt * 12;
    if(floats[i].t <= 0) floats.splice(i, 1);
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(dt){
  tclock += dt;
  if(flash > 0) flash -= dt;
  if(killMsg > 0) killMsg -= dt;
  if(online){
    netUpdate(dt);
    if(mode === 'dead') deadT += dt;
    return;
  }
  if((mode === 'lobby' || mode === 'create' || mode === 'joinpass') && net.state === 'failed' && tclock >= net.retryAt) netConnect();

  WORLD.gridT -= dt;
  if(WORLD.gridT <= 0){ WORLD.gridT = 0.15; rebuildFoodGrid(WORLD, food); }

  for(let i = respawnQ.length - 1; i >= 0; i--){
    respawnQ[i] -= dt;
    if(respawnQ[i] <= 0){ respawnQ.splice(i, 1); spawnAI(false); }
  }

  if(isFormMode()){
    cam.x = Math.cos(tclock * 0.07) * CFG.R * 0.5;
    cam.y = Math.sin(tclock * 0.11) * CFG.R * 0.5;
  }

  if(mode === 'play' && player && !player.dead) steerPlayer(dt);

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    if(s.protect > 0) s.protect -= dt;
    if(!s.isPlayer) aiThink(WORLD, s, dt);
    moveSnake(s, dt);
  }

  if(mode === 'play' && player && !player.dead){
    cam.x += (player.x - cam.x) * Math.min(1, dt * 11);
    cam.y += (player.y - cam.y) * Math.min(1, dt * 11);
  }
  if(mode === 'dead') deadT += dt;

  handleCollisions();
  updateFood(dt);
}

/* remove cobras mortas da lista após um tempo */
setInterval(function(){
  for(let i = snakes.length - 1; i >= 0; i--){
    if(snakes[i].dead && snakes[i] !== player) snakes.splice(i, 1);
  }
}, 1200);

function loop(now){
  if(!lastFrame) lastFrame = now;
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if(!isFinite(dt) || dt < 0) dt = 0.016;
  dt = Math.min(0.033, dt);
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   RENDER
   ============================================================ */
function sx(x){ return x - cam.x + W / 2; }
function sy(y){ return y - cam.y + H / 2; }

function fillCircle(cx, cy, r, color){
  const y0 = Math.max(0, Math.ceil(cy - r));
  const y1 = Math.min(H - 1, Math.floor(cy + r));
  ctx.fillStyle = color;
  for(let y = y0; y <= y1; y++){
    const dy = y - cy;
    const hh = r * r - dy * dy;
    if(hh < 0) continue;
    const h = Math.sqrt(hh);
    const a = Math.max(0, Math.round(cx - h));
    const b = Math.min(W - 1, Math.round(cx + h));
    if(b >= a) ctx.fillRect(a, y, b - a + 1, 1);
  }
}

function circleRing(cx, cy, rOut, rIn, color){
  const y0 = Math.max(0, Math.ceil(cy - rOut));
  const y1 = Math.min(H - 1, Math.floor(cy + rOut));
  ctx.fillStyle = color;
  for(let y = y0; y <= y1; y++){
    const dy = y - cy;
    const ho2 = rOut * rOut - dy * dy;
    if(ho2 < 0) continue;
    const ho = Math.sqrt(ho2);
    const hi2 = rIn * rIn - dy * dy;
    const xo0 = Math.max(0, Math.round(cx - ho));
    const xo1 = Math.min(W - 1, Math.round(cx + ho));
    if(hi2 <= 0){
      if(xo1 >= xo0) ctx.fillRect(xo0, y, xo1 - xo0 + 1, 1);
    } else {
      const hi = Math.sqrt(hi2);
      const xi0 = Math.round(cx - hi), xi1 = Math.round(cx + hi);
      const a1 = Math.max(0, Math.min(W - 1, xi0));
      if(a1 > xo0) ctx.fillRect(xo0, y, a1 - xo0, 1);
      const b1 = Math.min(W - 1, Math.max(0, xi1));
      if(xo1 > b1) ctx.fillRect(b1 + 1, y, xo1 - b1, 1);
    }
  }
}

function drawArena(){
  ctx.fillStyle = outPattern;
  ctx.fillRect(-6, -6, W + 12, H + 12);
  const ax = sx(0), ay = sy(0);
  circleRing(ax, ay, CFG.R, CFG.R - 4, PAL.DARK);
  fillCircle(ax, ay, CFG.R - 4, PAL.BG);

  // grade de pixels (só dentro da arena)
  ctx.fillStyle = 'rgba(31,43,6,0.085)';
  const step = 8;
  const wStartX = cam.x - W / 2, wStartY = cam.y - H / 2;
  const gx0 = Math.floor(wStartX / step) * step;
  const gy0 = Math.floor(wStartY / step) * step;
  for(let gx = gx0; gx < wStartX + W; gx += step){
    for(let gy = gy0; gy < wStartY + H; gy += step){
      if(gx * gx + gy * gy > (CFG.R - 6) * (CFG.R - 6)) continue;
      ctx.fillRect(Math.round(sx(gx)), Math.round(sy(gy)), 1, 1);
    }
  }
}

function drawFood(){
  const pulse = Math.floor(tclock * 3) % 2;
  for(let i = 0; i < food.length; i++){
    const f = food[i];
    const px = Math.round(sx(f.x)), py = Math.round(sy(f.y));
    if(px < -4 || px > W + 4 || py < -4 || py > H + 4) continue;
    if(f.big){
      const r = pulse ? 2 : 1;
      ctx.fillStyle = PAL.DARK;
      ctx.fillRect(px - r, py - r, r * 2 + 1, r * 2 + 1);
      ctx.fillStyle = PAL.LIGHT;
      ctx.fillRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = PAL.MID;
      ctx.fillRect(px - 1, py - 1, 3, 3);
    }
  }
}

function drawSnake(s){
  const n = s.path.length;
  const R = s.r;
  const bb = s.bbox, mg = R + 14;
  if(sx(bb.x1) < -mg || sx(bb.x0) > W + mg || sy(bb.y1) < -mg || sy(bb.y0) > H + mg) return;
  const blink = (s.protect > 0) && (Math.floor(tclock * 8) % 2 === 0);
  if(blink) ctx.globalAlpha = 0.35;
  for(let i = n - 1; i >= 0; i--){
    const nd = s.path[i];
    const px = Math.round(sx(nd.x)), py = Math.round(sy(nd.y));
    if(px < -12 || px > W + 12 || py < -12 || py > H + 12) continue;
    let r = R;
    const t = n - 1 - i;           // distância até a ponta do rabo
    if(t < 8) r = Math.max(2, Math.round(R * (0.55 + 0.45 * t / 8)));
    ctx.drawImage(discSprite(s.color, r), px - r, py - r);
  }
  const hx = Math.round(sx(s.x)), hy = Math.round(sy(s.y));
  const hr = s.boosting ? R + 1 : R;
  ctx.drawImage(discSprite(s.color, hr), hx - hr, hy - hr);

  // olhos (crescem com a cobra)
  const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
  const ex = -sa, ey = ca;
  const ox = ca * R * 0.4, oy = sa * R * 0.4;
  const sep = Math.max(2, R * 0.65);
  const es = R >= 6 ? 3 : (R >= 4 ? 2 : 1);
  const e1x = hx + ox + ex * sep, e1y = hy + oy + ey * sep;
  const e2x = hx + ox - ex * sep, e2y = hy + oy - ey * sep;
  ctx.fillStyle = PAL.LIGHT;
  if(es === 1){
    ctx.fillRect(Math.round(e1x), Math.round(e1y), 1, 1);
    ctx.fillRect(Math.round(e2x), Math.round(e2y), 1, 1);
  } else {
    const h = (es - 1) / 2;
    ctx.fillRect(Math.round(e1x - h), Math.round(e1y - h), es, es);
    ctx.fillRect(Math.round(e2x - h), Math.round(e2y - h), es, es);
    ctx.fillStyle = PAL.DARK;     // pupila olhando para frente
    ctx.fillRect(Math.round(e1x + ca * 0.8), Math.round(e1y + sa * 0.8), 1, 1);
    ctx.fillRect(Math.round(e2x + ca * 0.8), Math.round(e2y + sa * 0.8), 1, 1);
  }

  // nome
  const ny = hy - 12 - (R - 3);
  if(s.name && !s.isPlayer && hx > -30 && hx < W + 30 && hy > -20 && hy < H + 20){
    drawTextC(s.name, hx, ny, PAL.DARK, 1);
  }
  if(s.isPlayer && mode === 'play'){
    drawTextC(s.name, hx, ny, PAL.DARK, 1);
  }
  if(blink) ctx.globalAlpha = 1;
}

function drawParticles(){
  for(let i = 0; i < parts.length; i++){
    const p = parts[i];
    const px = Math.round(sx(p.x)), py = Math.round(sy(p.y));
    if(px < 0 || px >= W || py < 0 || py >= H) continue;
    ctx.fillStyle = p.t > 0.2 ? PAL.LIGHT : PAL.MID;
    ctx.fillRect(px, py, 1, 1);
  }
  for(let i = 0; i < floats.length; i++){
    const f = floats[i];
    drawTextC(f.text, sx(f.x), sy(f.y), PAL.DARK, 1);
  }
}

function drawHUD(){

    ctx.fillStyle = PAL.DARK;                                   // marcas N / S / L / O
    ctx.fillRect(J.cx - 1, J.cy - J.r + 4, 3, 1); ctx.fillRect(J.cx - 1, J.cy + J.r - 5, 3, 1);
    ctx.fillRect(J.cx - J.r + 4, J.cy - 1, 1, 3); ctx.fillRect(J.cx + J.r - 5, J.cy - 1, 1, 3);
    const kx = Math.round(J.cx + joy.kx), ky = Math.round(J.cy + joy.ky);
    fillCircle(kx, ky, J.kr, PAL.DARK);
    fillCircle(kx, ky, Math.max(1, J.kr - 3), joy.active ? PAL.LIGHT : PAL.MID);
  }

  if(touchMode){
    const b = turboBtn();
    ctx.fillStyle = 'rgba(165,201,58,0.55)';
    ctx.fillRect(b.x, b.y, b.s, b.s);
    ctx.fillStyle = PAL.DARK;
    ctx.fillRect(b.x, b.y, b.s, 1); ctx.fillRect(b.x, b.y + b.s - 1, b.s, 1);
    ctx.fillRect(b.x, b.y, 1, b.s); ctx.fillRect(b.x + b.s - 1, b.y, 1, b.s);
    drawTextC(turboHeld ? '>>' : 'TURBO', b.x + b.s / 2, b.y + b.s / 2 - 3, PAL.DARK, 1);
  }
}

function drawMinimap(){
  const size = Math.min(46, Math.max(30, Math.round(H * 0.26)));
  const mx = 3, my = H - size - 3;
  ctx.fillStyle = 'rgba(223,240,160,0.5)';
  ctx.fillRect(mx, my, size, size);
  ctx.fillStyle = PAL.DARK;
  ctx.fillRect(mx, my, size, 1); ctx.fillRect(mx, my + size - 1, size, 1);
  ctx.fillRect(mx, my, 1, size); ctx.fillRect(mx + size - 1, my, 1, size);

  const cx = mx + size / 2, cy = my + size / 2, rad = size / 2 - 3;
  ctx.fillStyle = PAL.MID;
  for(let a = 0; a < Math.PI * 2; a += Math.PI / 18){
    ctx.fillRect(Math.round(cx + Math.cos(a) * rad), Math.round(cy + Math.sin(a) * rad), 1, 1);
  }
  const k = rad / CFG.R;
  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(s.dead) continue;
    const px = Math.round(cx + s.x * k), py = Math.round(cy + s.y * k);
    if(s.isPlayer){
      ctx.fillStyle = PAL.DARK;
      ctx.fillRect(px - 1, py - 1, 3, 3);
      ctx.fillStyle = PAL.LIGHT;
      ctx.fillRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = PAL.MID;
      ctx.fillRect(px, py, 1, 1);
    }
  }
}

function panel(x, y, w, h, fill){
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = PAL.DARK;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}

/* cobra pixelada animada (fundo do menu) */
const COBRA_W = 64, COBRA_H = 60;
const cobraCv = document.createElement('canvas');
cobraCv.width = COBRA_W; cobraCv.height = COBRA_H;
const cg = cobraCv.getContext('2d');
const CB = { OUT:'#3a4a0f', BODY:'#6f9120', HI:'#8fb02a', BELLY:'#dff0a0', EYE:'#1f2b06' };

function cEll(cx, cy, rx, ry, col){
  cx = Math.round(cx); cy = Math.round(cy); rx = Math.round(rx); ry = Math.max(1, Math.round(ry));
  cg.fillStyle = col;
  for(let dy = -ry; dy <= ry; dy++){
    const half = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry + 0.0001))) + 0.0001);
    cg.fillRect(cx - half, cy + dy, half * 2 + 1, 1);
  }
}
function cDisc(cx, cy, r, col){ cEll(cx, cy, r, r, col); }

function drawCobraSprite(t){
  cg.clearRect(0, 0, COBRA_W, COBRA_H);
  const wag = Math.sin(t * 3.2), wag2 = Math.sin(t * 3.2 - 0.9);

  // cauda em gancho (balança)
  const P0 = {x:18, y:47}, P1 = {x:1 + wag2 * 1.5, y:42}, P2 = {x:2 + wag2 * 3, y:21 + wag * 1.5}, P3 = {x:14 + wag * 4, y:25 + Math.cos(t * 3.2) * 2.5};
  const tail = [];
  for(let i = 0; i <= 36; i++){
    const u = i / 36, v = 1 - u;
    const a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    tail.push({ x: a * P0.x + b * P1.x + c * P2.x + d * P3.x,
                y: a * P0.y + b * P1.y + c * P2.y + d * P3.y,
                r: Math.max(1, 4 - 3 * u) });
  }
  for(let i = 0; i < tail.length; i++) cDisc(tail[i].x, tail[i].y, Math.round(tail[i].r) + 1, CB.OUT);
  for(let i = 0; i < tail.length; i++) cDisc(tail[i].x, tail[i].y, Math.round(tail[i].r), CB.BODY);

  // espiral da base
  cEll(34, 49, 28, 10, CB.OUT);
  cEll(34, 49, 27, 9, CB.BELLY);
  cEll(34, 47, 27, 8, CB.BODY);
  cg.fillStyle = CB.HI;
  for(let y = 39; y <= 55; y++){
    for(let x = 7; x <= 61; x++){
      const dx = (x - 34) / 26, dy = (y - 47) / 7.5;
      if(dx * dx + dy * dy < 0.85 && ((x * 3 + y * 5) % 7 === 0)) cg.fillRect(x, y, 1, 1);
    }
  }

  // pescoço (balança de leve)
  const sw = Math.sin(t * 2) * 1.6;
  const neck = [];
  for(let i = 0; i <= 18; i++){
    const u = i / 18;
    neck.push({ x: 39 - 11 * u + sw * u * u - 3 * Math.sin(u * Math.PI), y: 44 - 30 * u, r: 8 - 2 * u });
  }
  for(let i = 0; i < neck.length; i++) cDisc(neck[i].x, neck[i].y, Math.round(neck[i].r) + 1, CB.OUT);
  for(let i = 0; i < neck.length; i++) cDisc(neck[i].x, neck[i].y, Math.round(neck[i].r), CB.BODY);
  for(let i = 3; i < neck.length; i++) cDisc(neck[i].x - 2, neck[i].y, Math.max(2, Math.round(neck[i].r) - 3), CB.BELLY);

  // capelo + cabeça
  const hx = Math.round(28 + sw), hy = Math.round(14 + Math.sin(t * 2.5) * 0.8);
  cEll(hx + 4, hy + 3, 11, 10, CB.OUT);
  cEll(hx + 4, hy + 3, 10, 9, CB.BODY);
  cEll(hx + 5, hy + 4, 5, 6, CB.HI);

  cEll(hx - 5, hy + 4, 7, 2, CB.OUT);
  cEll(hx - 5, hy + 4, 6, 1, CB.BELLY);
  cEll(hx - 2, hy, 9, 5, CB.OUT);
  cEll(hx - 2, hy, 8, 4, CB.BODY);
  cEll(hx - 9, hy + 1, 5, 4, CB.OUT);
  cEll(hx - 9, hy + 1, 4, 3, CB.BODY);
  cg.fillStyle = CB.OUT;
  cg.fillRect(hx - 12, hy + 3, 9, 1);           // boca

  // olho (pisca de vez em quando)
  if((t % 3.6) > 3.45){
    cg.fillStyle = CB.OUT; cg.fillRect(hx - 4, hy - 1, 2, 1);
  } else {
    cg.fillStyle = CB.EYE; cg.fillRect(hx - 4, hy - 2, 2, 2);
    cg.fillStyle = CB.BELLY; cg.fillRect(hx - 4, hy - 2, 1, 1);
  }

  // língua
  const ph = t % 2.8;
  if(ph < 0.5){
    const len = Math.round(Math.min(1, ph * 8) * 6);
    cg.fillStyle = CB.EYE;
    cg.fillRect(hx - 14 - len, hy + 3, len, 1);
    if(len >= 4){ cg.fillRect(hx - 14 - len, hy + 2, 1, 1); cg.fillRect(hx - 14 - len, hy + 4, 1, 1); }
  }

  // espiral da frente
  cEll(37, 52, 25, 7, CB.OUT);
  cEll(37, 52, 24, 6, CB.BODY);
  cEll(37, 50, 22, 4, CB.HI);
}


/* layout do menu (usado para desenhar e para detectar cliques) */
function diffLabels(btnW){
  return btnW >= textWidth('DIFICIL', 1) + 4 ? ['FACIL', 'MEDIO', 'DIFICIL'] : ['F', 'M', 'D'];
}

function menuLayout(){
  const pw = Math.max(112, Math.min(W - 12, 200));
  let lines = [];
  if(H >= 225){
    lines = ['MOUSE = GUIAR', 'JOYSTICK = GUIAR', 'CLIQUE = TURBO', 'ESPACO = TURBO',
             'COMER = CRESCER', 'MELHOR ' + pad4(best)];
  } else if(H >= 200){
    lines = ['MOUSE = GUIAR', 'CLIQUE = TURBO', 'COMER = CRESCER', 'MELHOR ' + pad4(best)];
  }
  const compact = H < 156;
  const ts = !compact ? Math.max(1, Math.min(3, Math.floor((pw - 14) / textWidth('SNAKE.IO', 1)))) : 1;
  const bw = pw - 24;
  const L = { pw: pw, lines: lines, ts: ts, bw: bw, compact: compact };
  const g1 = compact ? 3 : 5, g2 = compact ? 3 : 4;
  let y = compact ? 5 : 8;
  L.titleY = y; y += 7 * ts + 4;
  L.decoY = y;  if(!compact) y += 7;
  L.linesY = y; y += lines.length * 10 + (lines.length ? 2 : 0);
  L.labelY = y; if(!compact) y += 9;
  L.fieldY = y; y += 13 + g1;
  L.dLabelY = y; if(!compact) y += 9;
  L.dRowY = y;  y += 13 + g1;
  L.playY = y;  y += 13 + g2;
  L.multiY = y; y += 13 + g2;
  L.closeY = y; y += 13 + (compact ? 4 : 7);
  L.ph = y;
  L.px = Math.round((W - pw) / 2);
  L.py = Math.round((H - L.ph) / 2);
  L.bx = L.px + Math.round((pw - bw) / 2);
  L.dRowX = L.px + 4;
  L.dBtnW = Math.floor((pw - 8 - 4) / 3);
  return L;
}

/* campo de texto desenhado no canvas */
function drawField(x, y, w, key, placeholder, mask){
  const focused = fieldFocused(key);
  panel(x, y, w, 13, 'rgba(223,240,160,0.75)');
  if(focused){
    ctx.fillStyle = PAL.MID;
    ctx.fillRect(x + 2, y + 2, w - 4, 1);
    ctx.fillRect(x + 2, y + 10, w - 4, 1);
  }
  const raw = fieldVal(key);
  const txt = mask ? new Array(raw.length + 1).join('*') : raw;
  if(txt) drawText(txt, x + 4, y + 3, PAL.DARK, 1);
  else if(!focused && placeholder) drawText(placeholder, x + 4, y + 3, PAL.TXT2, 1);
  if(focused && (tclock % 1) < 0.6){
    ctx.fillStyle = PAL.DARK;
    ctx.fillRect(x + 4 + textWidth(txt, 1), y + 3, 1, 7);
  }
}

function drawBtn(x, y, w, label, solid, h){
  h = h || 13;
  panel(x, y, w, h, solid ? PAL.DARK : 'rgba(223,240,160,0.6)');
  drawTextC(label, x + w / 2, y + Math.round((h - 7) / 2), solid ? PAL.LIGHT : PAL.DARK, 1);
}

/* cadeados em pixel (7x8) */
const LOCK_CLOSED = ['..###..', '.#...#.', '.#...#.', '#######', '#######', '###.###', '###.###', '#######'];
const LOCK_OPEN   = ['..###..', '.#...#.', '.#.....', '#######', '#######', '###.###', '###.###', '#######'];
function drawBits(rows, x, y, color){
  ctx.fillStyle = color;
  for(let r = 0; r < rows.length; r++){
    const row = rows[r];
    let c = 0;
    while(c < row.length){
      if(row[c] !== '#'){ c++; continue; }
      let e = c;
      while(e < row.length && row[e] === '#') e++;
      ctx.fillRect(x + c, y + r, e - c, 1);
      c = e;
    }
  }
}
function drawLock(x, y, closed, color){ drawBits(closed ? LOCK_CLOSED : LOCK_OPEN, x, y, color); }

function menuClick(p){
  const L = menuLayout();
  for(let i = 0; i < 3; i++){
    if(hitRect(p, L.dRowX + i * (L.dBtnW + 2), L.py + L.dRowY, L.dBtnW, 13)){
      setDifficulty(i);
      return;
    }
  }
  if(hitRect(p, L.bx, L.py + L.fieldY, L.bw, 13)){
    focusField('name');
  } else if(hitRect(p, L.bx, L.py + L.playY, L.bw, 13)){
    startGame();
  } else if(hitRect(p, L.bx, L.py + L.multiY, L.bw, 13)){
    openLobby();
  } else if(hitRect(p, L.bx, L.py + L.closeY, L.bw, 13)){
    closeGame();
  } else {
    nameEl.blur();
  }
}
