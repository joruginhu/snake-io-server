const SKULL_UP = ["..................................................", "..................................................", ".............................WWWWWWWWWWWW.........", "......................WWWWWWWWgWWWWWWWWWWWW.......", "...................WWWWWWWWWWWgWWWWWWWWWWWWW......", "................WWWWgggWWWWWWWWgWWWWWWWWWWWWW.....", "............WWWWWgggWggggggWWWWggWWWWWWWWWWWWW....", ".........WWWWWgggWWWggkkkkggWWWWgWWWWWWWWWWWWWW...", "......WWWWWWWWWWWWWggkkkkkkggWWWgWWWWWWWWWWWWWW...", "...WWWWWWWWWWWWWWWWgkkkkkkkkgWWWWgWWWWWWWWWWWWW...", "..WWWWWWWWWWWWWWWWWgkkkkkkkkgWWWWgWWWWWWWWWWWWWW..", ".WWWkkkWWWWWWWWWWWWgkkkkkkkkgWWWWgWWWWWWWWWWWWWW..", ".WWWkkkWWWWWWWWWWWWgkkkkkkkkgWWWWgWWWWWWWWWWWWWW..", ".WWWkkkWWWWWWWWWWWWggkkkkkkggWWWgWWWWWWWWWWWWWWW..", "..WWWWWWWWWWWWWWWWWWggkkkkggWWWWgWWWWWWWWWWWWWW...", "..WWWWWWWWWWWWWWWWWWWggggggWWWWWgWWWWWWWWWWWWWW...", "..WWWWWWWWWWWWWWWWWWWWWWWWWWWWWgWWWWWWWWWWWWWWW...", "...WWWWWWWWWWWWWWWWWWWWWWWWWWWWgWWWWWWWWWWWWWW....", "...WWWWWWWWWWWWWWWWWWWWWWWWWWWWgWWWWWWWWWWWWW.....", "...W.WWWWW..WWWW..WWWWWWWWWWWWWWWWWWWWWWWWWW......", ".....WWWW...WWW...........WWWWWWWWWWWWWWWWWW......", "......WW.....W..........................WWWW......", "......WW.....W..........................WWWW......", "......WW.....W..........................WWWW......", "......WW.....W..........................WWWW......", "......WW.....W..........................WWWW......", ".............W..........................WWWW......", "........................................WWWW......", "........................................WWWW......"];
const SKULL_LO = ["................WW.WW.WW.WW.WW.WW.WW..............", ".............................WWWWWWWWW............", "...........WWWWWWWWWWWWWWWWWWWWWWWWWWWW...........", "..WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW..........", "..WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW..........", "...WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW............", ".....WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW............."];
const SKULL_LOY = 24, SKULL_W = 50, SKULL_H = 35;
const SKULL_COL = { W:'#ffffff', g:'#cdcdcd', k:'#4a0804' };

function drawPix(rows, x, y, sc){
  for(let r = 0; r < rows.length; r++){
    const row = rows[r];
    let c = 0;
    while(c < row.length){
      const ch = row[c];
      if(ch === '.'){ c++; continue; }
      let e = c;
      while(e < row.length && row[e] === ch) e++;
      ctx.fillStyle = SKULL_COL[ch];
      ctx.fillRect(x + c * sc, y + r * sc, (e - c) * sc, sc);
      c = e;
    }
  }
}

function deadLayout(){
  const sc = H >= 150 ? 2 : 1;
  const ts = textWidth('VOCE MORREU', 2) <= W - 10 ? 2 : 1;
  const bw = Math.min(W - 16, 118), bh = 13;
  const skH = SKULL_H * sc;
  const total = skH + 6 + 7 * ts + 5 + 7 + 7 + bh + 4 + bh;
  const top = Math.max(2, Math.round((H - total) / 2));
  const L = { sc: sc, ts: ts, bw: bw, bh: bh };
  L.skX = Math.round((W - SKULL_W * sc) / 2);
  L.skY = top;
  L.titleY = top + skH + 6;
  L.statY = L.titleY + 7 * ts + 5;
  L.bx = Math.round((W - bw) / 2);
  L.retryY = L.statY + 14;
  L.menuY = L.retryY + bh + 4;
  return L;
}

function drawDead(){
  const t = deadT;
  const a = Math.min(0.8, t * 2.2);
  ctx.fillStyle = 'rgba(165,20,8,' + a + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(40,0,0,' + (a * 0.55) + ')';
  ctx.fillRect(0, 0, W, 3); ctx.fillRect(0, H - 3, W, 3);
  ctx.fillRect(0, 0, 3, H); ctx.fillRect(W - 3, 0, 3, H);

  const L = deadLayout();

  // caveira entra caindo e depois "ri" mexendo a mandíbula
  const u = Math.max(0, Math.min(1, (t - 0.25) / 0.5));
  if(u > 0){
    const e = 1 - Math.pow(1 - u, 3);
    const jaw = u < 1 ? 0 : (Math.sin(t * 7) > 0.15 ? 4 : 1);
    const yo = Math.round(-(1 - e) * 16);
    ctx.globalAlpha = e;
    drawPix(SKULL_LO, L.skX, L.skY + yo + (SKULL_LOY + jaw) * L.sc, L.sc);
    drawPix(SKULL_UP, L.skX, L.skY + yo, L.sc);
    ctx.globalAlpha = 1;
  }

  if(t > 0.55){
    ctx.globalAlpha = Math.min(1, (t - 0.55) / 0.25);
    drawTextC('VOCE MORREU', W / 2 + L.ts, L.titleY + L.ts, '#4a0804', L.ts);
    drawTextC('VOCE MORREU', W / 2, L.titleY, '#ffffff', L.ts);
    let stat = 'TAM ' + pad4(player ? player.mass : 0) + ' MELHOR ' + pad4(best);
    if(textWidth(stat, 1) > W - 6) stat = 'TAM ' + pad4(player ? player.mass : 0);
    drawTextC(stat, W / 2, L.statY, '#ffd9d2', 1);
    ctx.globalAlpha = 1;
  }

  if(t > 0.8){
    ctx.globalAlpha = Math.min(1, (t - 0.8) / 0.25);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(L.bx, L.retryY, L.bw, L.bh);
    drawTextC('TENTAR DE NOVO', W / 2, L.retryY + 3, '#8a1208', 1);

    ctx.fillStyle = 'rgba(60,4,2,0.6)';
    ctx.fillRect(L.bx, L.menuY, L.bw, L.bh);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(L.bx, L.menuY, L.bw, 1); ctx.fillRect(L.bx, L.menuY + L.bh - 1, L.bw, 1);
    ctx.fillRect(L.bx, L.menuY, 1, L.bh); ctx.fillRect(L.bx + L.bw - 1, L.menuY, 1, L.bh);
    drawTextC('VOLTAR AO MENU', W / 2, L.menuY + 3, '#ffffff', 1);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   MULTIPLAYER (cliente)
   ============================================================ */
const net = {
  ws: null, state: 'off',          // off | connecting | open | failed | nourl
  retryAt: 0, connectT: 0,
  rooms: [],
  id: null, roomName: '',
  snakes: new Map(), foodMap: new Map(), players: {},
  seq: 0, lastAngle: null, lastBoost: false, lastSend: 0, camSnap: true
};

function serverUrl(){
  let u = '';
  try{ u = new URLSearchParams(window.location.search).get('server') || ''; }catch(e){}
  if(!u){
    const h = window.location && window.location.hostname;
    u = (h === 'localhost' || h === '127.0.0.1') ? ('ws://' + h + ':8080') : SERVER_URL;
  }
  // aceita o endereço copiado do navegador (https://...) e converte para wss://
  u = String(u).trim().replace(/^http/i, 'ws').replace(/\/+$/, '');
  return u;
}

function netSend(obj){
  if(net.ws && net.ws.readyState === 1){
    try{ net.ws.send(JSON.stringify(obj)); }catch(e){}
  }
}

function netConnect(){
  if(net.ws && (net.ws.readyState === 0 || net.ws.readyState === 1)) return;
  const url = serverUrl();
  if(!url){ net.state = 'nourl'; return; }
  net.state = 'connecting';
  net.connectT = tclock;
  // "acorda" o servidor grátis (pode levar ~30s) enquanto tenta conectar
  try{ fetch(url.replace(/^ws/, 'http'), {mode: 'no-cors'}).catch(function(){}); }catch(e){}
  let ws;
  try{ ws = new WebSocket(url); }catch(e){ net.state = 'failed'; net.retryAt = tclock + 3; return; }
  net.ws = ws;
  ws.onopen = function(){
    if(net.ws !== ws) return;
    net.state = 'open';
    netSend({t: 'list'});
  };
  ws.onmessage = function(ev){ if(net.ws === ws) netMessage(ev.data); };
  ws.onclose = function(){
    if(net.ws !== ws) return;
    net.ws = null;
    net.state = 'failed';
    net.retryAt = tclock + 3;
    if(online){
      leaveOnline(true);
      mode = 'lobby';
      formErr = 'CONEXAO PERDIDA';
    }
  };
  ws.onerror = function(){};
}

function netRefresh(){
  if(net.state === 'open') netSend({t: 'list'});
  else if(net.state === 'failed' || net.state === 'off') netConnect();
}

function netMessage(data){
  let m;
  try{ m = JSON.parse(data); }catch(e){ return; }
  switch(m.t){
    case 'rooms':
      net.rooms = m.rooms || [];
      clampLobbyPage();
      break;
    case 'joined': enterOnline(m); break;
    case 'meta':
      net.players = {};
      for(let i = 0; i < m.players.length; i++) net.players[m.players[i].id] = m.players[i];
      break;
    case 's': if(online) applySnapshot(m); break;
    case 'dead': if(online) onlineDead(m); break;
    case 'kill':
      killMsg = 1.6; killMsgText = 'ELIMINADO ' + m.name; sfxKill();
      break;
    case 'respawned':
      if(online){ mode = 'play'; player = null; net.lastAngle = null; deadT = 0; flash = 0; sfxStart(); }
      break;
    case 'err':
      formErr = m.msg || 'ERRO';
      if(net.state === 'open') netSend({t: 'list'});
      break;
  }
}

function netMakeSnake(id, x, y, a, mass){
  const s = {
    id: id, isPlayer: id === net.id, name: '', color: '#42561a',
    x: x, y: y, angle: a, sx: x, sy: y, sa: a,
    mass: mass, r: radiusFor(mass), path: [], boosting: false, dead: false,
    bbox: {x0: x, y0: y, x1: x, y1: y}, snapT: performance.now(), seen: 0
  };
  const n = nodesFor(mass);
  for(let i = 0; i < n; i++){
    s.path.push({ x: x - Math.cos(a) * i * CFG.SEG, y: y - Math.sin(a) * i * CFG.SEG });
  }
  return s;
}

function applySnapshot(m){
  const now = performance.now();
  net.seq++;
  for(let i = 0; i < m.p.length; i++){
    const e = m.p[i];
    let s = net.snakes.get(e[0]);
    if(!s){ s = netMakeSnake(e[0], e[1], e[2], e[3], e[4]); net.snakes.set(e[0], s); }
    s.sx = e[1]; s.sy = e[2]; s.sa = e[3]; s.mass = e[4]; s.boosting = !!e[5]; s.prot = !!e[6];
    s.snapT = now; s.seen = net.seq;
  }
  net.snakes.forEach(function(s, id){ if(s.seen !== net.seq) net.snakes.delete(id); });
  if(m.fa) for(let i = 0; i < m.fa.length; i++){
    const f = m.fa[i];
    net.foodMap.set(f[0], { x: f[1], y: f[2], m: f[3], big: !!f[4] });
  }
  if(m.fr) for(let i = 0; i < m.fr.length; i++) net.foodMap.delete(m.fr[i]);
}

function enterOnline(m){
  nameEl.blur();
  online = true;
  CFG.R = m.R;
  net.id = m.you; net.roomName = m.name;
  net.snakes = new Map(); net.foodMap = new Map(); net.players = {};
  for(let i = 0; i < m.food.length; i++){
    const f = m.food[i];
    net.foodMap.set(f[0], { x: f[1], y: f[2], m: f[3], big: !!f[4] });
  }
  net.lastAngle = null; net.lastBoost = false; net.lastSend = 0; net.camSnap = true;
  snakes = []; food = []; parts = []; floats = []; respawnQ = []; player = null;
  mode = 'play'; deadT = 0; flash = 0; killMsg = 0; formErr = '';
  sfxStart();
}

function leaveOnline(silent){
  if(!online) return;
  if(!silent) netSend({t: 'leave'});
  online = false;
  CFG.R = BASE_R;
  net.snakes = new Map(); net.foodMap = new Map(); net.players = {}; net.id = null;
  resetWorld(false);
}

function onlineDead(m){
  mode = 'dead'; deadT = 0; flash = 0.35;
  best = Math.max(best, Math.round(m.mass));
  player = { mass: m.mass, dead: true, isPlayer: true, name: getName() };
  net.snakes.delete(net.id);
  sfxDeath();
}

function onlineRespawn(){ netSend({t: 'respawn'}); }

function netUpdate(dt){
  const now = performance.now();
  const arr = [];
  net.snakes.forEach(function(s){
    const pl = net.players[s.id];
    if(pl){
      s.name = pl.name;
      s.color = s.isPlayer ? PLAYER_COLOR : ONLINE_SHADES[pl.c % ONLINE_SHADES.length];
    }
    // posição prevista a partir do último pacote do servidor
    const age = Math.min(0.12, (now - s.snapT) / 1000);
    const spd = CFG.SPEED * (s.boosting ? CFG.BOOST_MULT : 1);
    const tx = s.sx + Math.cos(s.sa) * spd * age, ty = s.sy + Math.sin(s.sa) * spd * age;
    if(Math.hypot(tx - s.x, ty - s.y) > 80){
      s.x = tx; s.y = ty;
      s.path.length = 0;
      const n = nodesFor(s.mass);
      for(let i = 0; i < n; i++) s.path.push({ x: s.x - Math.cos(s.sa) * i * CFG.SEG, y: s.y - Math.sin(s.sa) * i * CFG.SEG });
    } else {
      const k = Math.min(1, dt * 14);
      s.x += (tx - s.x) * k; s.y += (ty - s.y) * k;
    }
    s.angle += angleDiff(s.sa, s.angle) * Math.min(1, dt * 14);
    s.protect = s.prot ? 1 : 0;
    s.r = radiusFor(s.mass);

    // o corpo acompanha o caminho da cabeça
    let last = s.path[0];
    let dx = s.x - last.x, dy = s.y - last.y, d = Math.hypot(dx, dy), guard = 0;
    while(d >= CFG.SEG && guard++ < 40){
      const k2 = CFG.SEG / d;
      s.path.unshift({ x: last.x + dx * k2, y: last.y + dy * k2 });
      last = s.path[0]; dx = s.x - last.x; dy = s.y - last.y; d = Math.hypot(dx, dy);
    }
    const maxN = nodesFor(s.mass);
    while(s.path.length > maxN) s.path.pop();

    let x0 = s.x, y0 = s.y, x1 = s.x, y1 = s.y;
    const st = s.path.length > 60 ? 2 : 1;
    for(let i = 0; i < s.path.length; i += st){
      const n = s.path[i];
      if(n.x < x0) x0 = n.x; if(n.x > x1) x1 = n.x;
      if(n.y < y0) y0 = n.y; if(n.y > y1) y1 = n.y;
    }
    s.bbox.x0 = x0; s.bbox.y0 = y0; s.bbox.x1 = x1; s.bbox.y1 = y1;
    arr.push(s);
  });
  snakes = arr;
  food = Array.from(net.foodMap.values());

  if(mode === 'play'){
    player = net.snakes.get(net.id) || null;
    if(player){
      netSteer(player, now);
      if(net.camSnap){ cam.x = player.x; cam.y = player.y; net.camSnap = false; }
      cam.x += (player.x - cam.x) * Math.min(1, dt * 11);
      cam.y += (player.y - cam.y) * Math.min(1, dt * 11);
    }
  }
}

/* manda a direção/turbo para o servidor (no máximo ~20x por segundo) */
function netSteer(p, now){
  if(net.lastAngle === null) net.lastAngle = p.angle;
  let ang = net.lastAngle;
  const ra = readSteer(p);
  if(ra !== null) ang = ra;
  const boost = !!((pointer.down || turboHeld || keys[' ']) && p.mass > 14);
  const since = now - net.lastSend;
  if((since > 50 && (Math.abs(angleDiff(ang, net.lastAngle)) > 0.03 || boost !== net.lastBoost)) || since > 300){
    net.lastSend = now; net.lastAngle = ang; net.lastBoost = boost;
    netSend({t: 'in', a: Math.round(ang * 100) / 100, b: boost ? 1 : 0});
  }
}

/* ---------- lobby: lista de salas ---------- */
function openLobby(){
  nameEl.blur();
  mode = 'lobby';
  lobbyPage = 0; formErr = '';
  netConnect();
  netRefresh();
}

function lobbyLayout(){
  const pw = Math.min(W - 8, 280), px = Math.round((W - pw) / 2);
  const py = 4, ph = H - 8;
  const L = { px: px, py: py, pw: pw, ph: ph };
  L.titleY = py + 5;
  L.statusY = py + 15;
  L.headY = py + 26;
  L.listY = py + 37;
  L.rowH = 12;
  L.btnY2 = py + ph - 6 - 13;
  L.btnY1 = L.btnY2 - 3 - 13;
  L.rows = Math.max(1, Math.floor((L.btnY1 - 3 - L.listY) / L.rowH));
  L.bw = Math.floor((pw - 16 - 4) / 2);
  L.bx1 = px + 8; L.bx2 = L.bx1 + L.bw + 4;
  // linha de baixo:  [<] [VOLTAR] [>]
  L.arrW = 20;
  L.prevX = px + 8;
  L.nextX = px + pw - 8 - L.arrW;
  L.backX = L.prevX + L.arrW + 4;
  L.backW = L.nextX - 4 - L.backX;
  return L;
}

function lobbyPages(L){ return Math.max(1, Math.ceil(net.rooms.length / L.rows)); }
function clampLobbyPage(){
  const L = lobbyLayout();
  lobbyPage = Math.max(0, Math.min(lobbyPage, lobbyPages(L) - 1));
}

function pickRoom(r){
  if(net.state !== 'open'){ formErr = 'SEM CONEXAO'; return; }
  if(r.n >= r.max){ formErr = 'SALA CHEIA'; return; }
  formErr = '';
  if(r.priv){
    joinTarget = r; fval.jpass = '';
    mode = 'joinpass';
    focusField('jpass');
  } else {
    netSend({t: 'join', id: r.id, nick: getName()});
  }
}

function lobbyClick(p){
  const L = lobbyLayout();
  const start = lobbyPage * L.rows;
  for(let i = 0; i < L.rows; i++){
    const r = net.rooms[start + i];
    if(!r) break;
    if(hitRect(p, L.px + 6, L.listY + i * L.rowH, L.pw - 12, L.rowH)){ pickRoom(r); return; }
  }
  if(hitRect(p, L.bx1, L.btnY1, L.bw, 13)){
    if(net.state !== 'open'){ formErr = 'SEM CONEXAO'; return; }
    mode = 'create'; formErr = '';
    fval.room = ''; fval.pass = ''; createOpts.priv = false; createOpts.max = 8;
  }
  else if(hitRect(p, L.bx2, L.btnY1, L.bw, 13)){ formErr = ''; netRefresh(); }
  else if(hitRect(p, L.prevX, L.btnY2, L.arrW, 13)){ lobbyPage--; clampLobbyPage(); }
  else if(hitRect(p, L.nextX, L.btnY2, L.arrW, 13)){ lobbyPage++; clampLobbyPage(); }
  else if(hitRect(p, L.backX, L.btnY2, L.backW, 13)){ mode = 'menu'; formErr = ''; }
}

function drawLobby(){
  const L = lobbyLayout();
  panel(L.px, L.py, L.pw, L.ph, 'rgba(165,201,58,0.95)');
  drawTextC('SALAS ONLINE', W / 2, L.titleY, PAL.DARK, 1);

  let st, dark = false;
  if(net.state === 'nourl') st = 'SERVIDOR NAO CONFIGURADO';
  else if(net.state === 'connecting') st = (tclock - net.connectT > 4) ? 'ACORDANDO SERVIDOR...' : 'CONECTANDO...';
  else if(net.state === 'failed' || net.state === 'off') st = 'SEM CONEXAO - TENTANDO...';
  else if(formErr){ st = formErr; dark = true; }
  else st = net.rooms.length ? 'ESCOLHA UMA SALA' : 'NENHUMA SALA - CRIE UMA!';
  if(formErr && net.state !== 'open'){ st = formErr; dark = true; }
  drawTextC(st, W / 2, L.statusY, dark ? PAL.DARK : PAL.TXT2, 1);

  drawText('SALA', L.px + 24, L.headY, PAL.TXT2, 1);
  drawText('JOG', L.px + L.pw - 9 - textWidth('JOG', 1), L.headY, PAL.TXT2, 1);
  ctx.fillStyle = PAL.MID;
  ctx.fillRect(L.px + 6, L.headY + 9, L.pw - 12, 1);

  const start = lobbyPage * L.rows;
  for(let i = 0; i < L.rows; i++){
    const r = net.rooms[start + i];
    if(!r) break;
    const y = L.listY + i * L.rowH;
    const hov = pointer.active && !touchMode && hitRect(pointer, L.px + 6, y, L.pw - 12, L.rowH);
    if(hov){ ctx.fillStyle = 'rgba(31,43,6,0.14)'; ctx.fillRect(L.px + 6, y, L.pw - 12, L.rowH); }
    const full = r.n >= r.max;
    const col = full ? '#4d6513' : PAL.DARK;
    drawLock(L.px + 10, y + 2, !!r.priv, col);
    drawText(r.name, L.px + 24, y + 3, col, 1);
    const cnt = r.n + '/' + r.max;
    drawText(cnt, L.px + L.pw - 9 - textWidth(cnt, 1), y + 3, col, 1);
    ctx.fillStyle = 'rgba(31,43,6,0.15)';
    ctx.fillRect(L.px + 6, y + L.rowH - 1, L.pw - 12, 1);
  }

  drawBtn(L.bx1, L.btnY1, L.bw, 'CRIAR SALA', true);
  drawBtn(L.bx2, L.btnY1, L.bw, 'ATUALIZAR', false);
  drawBtn(L.prevX, L.btnY2, L.arrW, '<', false);
  drawBtn(L.backX, L.btnY2, L.backW, 'VOLTAR', false);
  drawBtn(L.nextX, L.btnY2, L.arrW, '>', false);
  const pg = (lobbyPage + 1) + '/' + lobbyPages(L);
  drawText(pg, L.px + L.pw - 9 - textWidth(pg, 1), L.titleY, PAL.TXT2, 1);
}

/* ---------- criar sala ---------- */
function createLayout(){
  const pw = Math.min(W - 8, 220);
  const big = H >= 140;
  const labels = H >= 175;
  const g = big ? 4 : 3;
  const L = { pw: pw, labels: labels };
  L.px = Math.round((W - pw) / 2);
  L.x = L.px + 8; L.w = pw - 16;
  let y = big ? 7 : 4;
  L.titleY = y; y += 7 + (big ? 6 : 3);
  L.nameLabelY = y; if(labels) y += 9;
  L.nameY = y; y += 13 + g;
  L.maxY = y; y += 13 + g;
  L.passLabelY = y; if(labels && createOpts.priv) y += 9;
  L.passY = y; if(createOpts.priv) y += 13 + g;
  L.errY = y; y += 9;
  L.btnY = y; y += 13;
  L.ph = y + (big ? 7 : 4);
  L.py = Math.max(1, Math.round((H - L.ph) / 2));
  L.privX = L.x + 66; L.privW = L.w - 66;
  L.bw = Math.floor((L.w - 4) / 2);
  L.bx1 = L.x; L.bx2 = L.x + L.bw + 4;
  return L;
}

function createClick(p){
  const L = createLayout();
  if(hitRect(p, L.x, L.py + L.nameY, L.w, 13)) focusField('room');
  else if(hitRect(p, L.privX, L.py + L.maxY, L.privW, 13)){ createOpts.priv = !createOpts.priv; nameEl.blur(); }
  else if(createOpts.priv && hitRect(p, L.x, L.py + L.passY, L.w, 13)) focusField('pass');
  else if(hitRect(p, L.bx1, L.py + L.btnY, L.bw, 13)) submitCreate();
  else if(hitRect(p, L.bx2, L.py + L.btnY, L.bw, 13)){ nameEl.blur(); mode = 'lobby'; formErr = ''; }
  else nameEl.blur();
}

function submitCreate(){
  if(net.state !== 'open'){ formErr = 'SEM CONEXAO'; return; }
  if(createOpts.priv && !fval.pass){ formErr = 'DEFINA UMA SENHA'; return; }
  formErr = '';
  netSend({ t: 'create', name: fval.room, priv: createOpts.priv ? 1 : 0,
            pass: fval.pass, nick: getName() });
}

function drawCreate(){
  const L = createLayout();
  panel(L.px, L.py, L.pw, L.ph, 'rgba(165,201,58,0.95)');
  drawTextC('CRIAR SALA', W / 2, L.py + L.titleY, PAL.DARK, 1);
  if(L.labels) drawText('NOME DA SALA', L.x, L.py + L.nameLabelY, PAL.TXT2, 1);
  drawField(L.x, L.py + L.nameY, L.w, 'room', 'MINHA SALA', false);

  const my = L.py + L.maxY;
  drawText('LIMITE 30', L.x, my + 3, PAL.TXT2, 1);
  const pv = createOpts.priv;
  panel(L.privX, my, L.privW, 13, pv ? PAL.DARK : 'rgba(223,240,160,0.6)');
  const label = pv ? 'PRIVADA' : 'PUBLICA';
  const tw = 7 + 4 + textWidth(label, 1);
  const lx = L.privX + Math.round((L.privW - tw) / 2);
  drawLock(lx, my + 3, pv, pv ? PAL.LIGHT : PAL.DARK);
  drawText(label, lx + 11, my + 3, pv ? PAL.LIGHT : PAL.DARK, 1);

  if(pv){
    if(L.labels) drawText('SENHA (A-Z 0-9)', L.x, L.py + L.passLabelY, PAL.TXT2, 1);
    drawField(L.x, L.py + L.passY, L.w, 'pass', 'SENHA', false);
  }
  if(formErr) drawTextC(formErr, W / 2, L.py + L.errY, PAL.DARK, 1);
  drawBtn(L.bx1, L.py + L.btnY, L.bw, 'CRIAR', true);
  drawBtn(L.bx2, L.py + L.btnY, L.bw, 'CANCELAR', false);
}

/* ---------- senha de sala privada ---------- */
function joinLayout(){
  const pw = Math.min(W - 8, 200), ph = 88;
  const L = { pw: pw, ph: ph };
  L.px = Math.round((W - pw) / 2);
  L.py = Math.max(1, Math.round((H - ph) / 2));
  L.fx = L.px + 10; L.fw = pw - 20;
  L.bw = Math.floor((L.fw - 4) / 2);
  L.bx1 = L.fx; L.bx2 = L.fx + L.bw + 4;
  L.titleY = 8; L.nameY = 21; L.fieldY = 36; L.errY = 54; L.btnY = 66;
  return L;
}

function joinClick(p){
  const L = joinLayout();
  if(hitRect(p, L.fx, L.py + L.fieldY, L.fw, 13)) focusField('jpass');
  else if(hitRect(p, L.bx1, L.py + L.btnY, L.bw, 13)) submitJoin();
  else if(hitRect(p, L.bx2, L.py + L.btnY, L.bw, 13)){ nameEl.blur(); mode = 'lobby'; formErr = ''; }
  else nameEl.blur();
}

function submitJoin(){
  if(!joinTarget) return;
  if(!fval.jpass){ formErr = 'DIGITE A SENHA'; return; }
  formErr = '';
  netSend({ t: 'join', id: joinTarget.id, pass: fval.jpass, nick: getName() });
}

function drawJoin(){
  const L = joinLayout();
  panel(L.px, L.py, L.pw, L.ph, 'rgba(165,201,58,0.95)');
  const title = 'SALA PRIVADA';
  const tw = 7 + 4 + textWidth(title, 1);
  const tx = Math.round(W / 2 - tw / 2);
  drawLock(tx, L.py + L.titleY - 1, true, PAL.DARK);
  drawText(title, tx + 11, L.py + L.titleY, PAL.DARK, 1);
  if(joinTarget) drawTextC(joinTarget.name, W / 2, L.py + L.nameY, PAL.TXT2, 1);
  drawField(L.fx, L.py + L.fieldY, L.fw, 'jpass', 'SENHA', true);
  if(formErr) drawTextC(formErr, W / 2, L.py + L.errY, PAL.DARK, 1);
  drawBtn(L.bx1, L.py + L.btnY, L.bw, 'ENTRAR', true);
  drawBtn(L.bx2, L.py + L.btnY, L.bw, 'CANCELAR', false);
}

function render(){
  const shake = (mode === 'dead' && deadT < 0.45);
  if(shake){
    const m = 4 * (1 - deadT / 0.45);
    ctx.save();
    ctx.translate(Math.round((Math.random() - 0.5) * 2 * m), Math.round((Math.random() - 0.5) * 2 * m));
  }
  drawArena();
  drawFood();

  for(let i = 0; i < snakes.length; i++){
    const s = snakes[i];
    if(!s.dead && !s.isPlayer) drawSnake(s);
  }
  if(player && !player.dead) drawSnake(player);
  drawParticles();

  if(mode === 'play'){
    drawHUD();
    if(online && W >= 230) drawTextC(net.roomName, W / 2, 3, PAL.TXT2, 1);
  }
  if(mode === 'menu') drawMenu();
  else if(mode === 'lobby') drawLobby();
  else if(mode === 'create') drawCreate();
  else if(mode === 'joinpass') drawJoin();
  if(shake) ctx.restore();
  if(mode === 'dead') drawDead();

  if(flash > 0){
    ctx.fillStyle = 'rgba(223,240,160,' + Math.max(0, Math.min(0.85, flash * 2.4)) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
resize();
resetWorld(false);
cam.x = 0; cam.y = 0;
requestAnimationFrame(loop);

})();
</script>
